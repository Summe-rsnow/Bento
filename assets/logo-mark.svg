<svg xmlns="http://www.w3.org/2000/svg" viewBox="164 132 696 696" width="24" height="24">
  <defs>
    <clipPath id="bmWellClip">
      <rect x="228" y="264" width="568" height="432" rx="76"/>
    </clipPath>
    <clipPath id="bmLeftBlockClip">
      <rect x="252" y="288" width="188" height="384" rx="44"/>
    </clipPath>
    <clipPath id="bmTopRightClip">
      <rect x="464" y="288" width="308" height="176" rx="44"/>
    </clipPath>
    <clipPath id="bmBotRightClip">
      <rect x="464" y="488" width="308" height="184" rx="44"/>
    </clipPath>

    <!-- Rich saturated emerald/teal/cyan tray readable on both light and dark surfaces -->
    <linearGradient id="bmTrayGrad" x1="210" y1="232" x2="814" y2="728" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="38%" stop-color="#10b981"/>
      <stop offset="74%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="bmWellGrad" x1="512" y1="264" x2="512" y2="696" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="55%" stop-color="#0b3b44"/>
      <stop offset="100%" stop-color="#0c2d48"/>
    </linearGradient>

    <linearGradient id="bmLeftBlockGrad" x1="252" y1="288" x2="440" y2="672" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="bmTopRightGrad" x1="464" y1="288" x2="772" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="42%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="bmBotRightGrad" x1="464" y1="488" x2="772" y2="672" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="bmBlockAO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#042f2e" stop-opacity="0"/>
      <stop offset="70%" stop-color="#042f2e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.26"/>
    </linearGradient>

    <linearGradient id="bmSparkleGrad" x1="564" y1="524" x2="672" y2="636" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <!-- Sculpted Outer Bento Tray -->
  <rect x="196" y="232" width="632" height="496" rx="104" fill="url(#bmTrayGrad)"/>

  <!-- Inner Recessed Pocket -->
  <rect x="228" y="264" width="568" height="432" rx="76" fill="url(#bmWellGrad)"/>
  <g clip-path="url(#bmWellClip)">
    <rect x="252" y="296" width="188" height="384" rx="44" fill="#02171a" fill-opacity="0.34"/>
    <rect x="464" y="296" width="308" height="176" rx="44" fill="#02171a" fill-opacity="0.32"/>
    <rect x="464" y="496" width="308" height="184" rx="44" fill="#02171a" fill-opacity="0.34"/>
  </g>

  <!-- Left tall block -->
  <rect x="252" y="288" width="188" height="384" rx="44" fill="url(#bmLeftBlockGrad)"/>
  <g clip-path="url(#bmLeftBlockClip)">
    <rect x="252" y="288" width="188" height="384" fill="url(#bmBlockAO)"/>
  </g>

  <!-- Top-right wide block -->
  <rect x="464" y="288" width="308" height="176" rx="44" fill="url(#bmTopRightGrad)"/>
  <g clip-path="url(#bmTopRightClip)">
    <rect x="464" y="288" width="308" height="176" fill="url(#bmBlockAO)"/>
  </g>

  <!-- Bottom-right widget block + crisp sparkle -->
  <rect x="464" y="488" width="308" height="184" rx="44" fill="url(#bmBotRightGrad)"/>
  <g clip-path="url(#bmBotRightClip)">
    <rect x="464" y="488" width="308" height="184" fill="url(#bmBlockAO)"/>
  </g>

  <path d="M 618 520 C 622 556, 642 576, 678 580 C 642 584, 622 604, 618 640 C 614 604, 594 584, 558 580 C 594 576, 614 556, 618 520 Z"
        fill="url(#bmSparkleGrad)"/>
</svg>
