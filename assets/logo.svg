<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Squircle app container clip -->
    <clipPath id="tileClip">
      <rect x="64" y="64" width="896" height="896" rx="212"/>
    </clipPath>

    <!-- Bento tray & module clips for razor-clean AO & 5px top rim glints -->
    <clipPath id="trayClip">
      <rect x="196" y="232" width="632" height="496" rx="104"/>
    </clipPath>
    <clipPath id="wellClip">
      <rect x="228" y="264" width="568" height="432" rx="76"/>
    </clipPath>
    <clipPath id="leftBlockClip">
      <rect x="252" y="288" width="188" height="384" rx="44"/>
    </clipPath>
    <clipPath id="topRightClip">
      <rect x="464" y="288" width="308" height="176" rx="44"/>
    </clipPath>
    <clipPath id="botRightClip">
      <rect x="464" y="488" width="308" height="184" rx="44"/>
    </clipPath>

    <!-- Deep obsidian canvas -->
    <linearGradient id="tileBg" x1="128" y1="72" x2="896" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="52%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#090c14"/>
    </linearGradient>

    <radialGradient id="topAura" cx="512" cy="356" r="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#0284c7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e1320" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tileRim" x1="180" y1="64" x2="844" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Soft emerald-teal floor glow -->
    <radialGradient id="levitateGlow" cx="512" cy="792" r="220" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 712) scale(1 0.1)">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.44"/>
      <stop offset="55%" stop-color="#0d9488" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer beveled bento tray shell -->
    <linearGradient id="trayGrad" x1="210" y1="232" x2="814" y2="728" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="30%" stop-color="#14b8a6"/>
      <stop offset="68%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0e5270"/>
    </linearGradient>
    <linearGradient id="trayRimGrad" x1="216" y1="232" x2="808" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#a7f3d0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Inner recessed tray pocket -->
    <linearGradient id="wellGrad" x1="512" y1="264" x2="512" y2="696" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#051b21"/>
      <stop offset="55%" stop-color="#07272c"/>
      <stop offset="100%" stop-color="#082032"/>
    </linearGradient>
    <radialGradient id="wellBounce" cx="512" cy="480" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.24"/>
      <stop offset="65%" stop-color="#0d9488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#07272c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wellTopAO" x1="512" y1="264" x2="512" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02080d" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#02080d" stop-opacity="0"/>
    </linearGradient>

    <!-- Tall left navigation/shell block -->
    <linearGradient id="leftBlockGrad" x1="252" y1="288" x2="440" y2="672" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="28%" stop-color="#34d399"/>
      <stop offset="68%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Wide top-right header/card block -->
    <linearGradient id="topRightGrad" x1="464" y1="288" x2="772" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="30%" stop-color="#6ee7b7"/>
      <stop offset="68%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Bottom-right widget block -->
    <linearGradient id="botRightGrad" x1="464" y1="488" x2="772" y2="672" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="40%" stop-color="#0d9488"/>
      <stop offset="76%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Soft bottom crease AO inside blocks -->
    <linearGradient id="blockCreaseAO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02181c" stop-opacity="0"/>
      <stop offset="76%" stop-color="#02181c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#02181c" stop-opacity="0.24"/>
    </linearGradient>

    <!-- 5px top rim highlights for modules -->
    <linearGradient id="moduleRimBright" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="65%" stop-color="#d1fae5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="moduleRimTeal" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.78"/>
      <stop offset="65%" stop-color="#6ee7b7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Luminous sparkle accent in bottom-right widget -->
    <radialGradient id="sparkleHalo" cx="618" cy="580" r="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.48"/>
      <stop offset="52%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkleGrad" x1="564" y1="524" x2="672" y2="636" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="54%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <g clip-path="url(#tileClip)">
    <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#tileBg)"/>
    <circle cx="512" cy="356" r="415" fill="url(#topAura)"/>
  </g>
  <rect x="65" y="65" width="894" height="894" rx="211" fill="none" stroke="url(#tileRim)" stroke-width="2.5"/>

  <!-- Soft floor glow -->
  <ellipse cx="512" cy="792" rx="204" ry="20" fill="url(#levitateGlow)"/>

  <!-- Sculpted Outer Bento Tray -->
  <rect x="196" y="232" width="632" height="496" rx="104" fill="url(#trayGrad)"/>
  <g clip-path="url(#trayClip)">
    <path d="M 196 340 L 196 336 A 104 104 0 0 1 300 232 L 724 232 A 104 104 0 0 1 828 336"
          fill="none" stroke="url(#trayRimGrad)" stroke-width="5"/>
  </g>

  <!-- Inner Recessed Bento Pocket -->
  <rect x="228" y="264" width="568" height="432" rx="76" fill="url(#wellGrad)"/>
  <g clip-path="url(#wellClip)">
    <rect x="228" y="264" width="568" height="432" rx="76" fill="url(#wellBounce)"/>
    <rect x="228" y="264" width="568" height="56" fill="url(#wellTopAO)"/>
    <!-- Subtle module drop shadows / crease AO inside well -->
    <rect x="252" y="298" width="188" height="384" rx="44" fill="#020a0e" fill-opacity="0.46"/>
    <rect x="464" y="298" width="308" height="176" rx="44" fill="#020a0e" fill-opacity="0.44"/>
    <rect x="464" y="498" width="308" height="184" rx="44" fill="#020a0e" fill-opacity="0.46"/>
  </g>

  <!-- Module 1: Tall left shell/navigation block -->
  <rect x="252" y="288" width="188" height="384" rx="44" fill="url(#leftBlockGrad)"/>
  <g clip-path="url(#leftBlockClip)">
    <rect x="252" y="288" width="188" height="384" fill="url(#blockCreaseAO)"/>
    <path d="M 252 340 L 252 332 A 44 44 0 0 1 296 288 L 396 288 A 44 44 0 0 1 440 332"
          fill="none" stroke="url(#moduleRimBright)" stroke-width="5"/>
  </g>

  <!-- Module 2: Wide top-right header/card block -->
  <rect x="464" y="288" width="308" height="176" rx="44" fill="url(#topRightGrad)"/>
  <g clip-path="url(#topRightClip)">
    <rect x="464" y="288" width="308" height="176" fill="url(#blockCreaseAO)"/>
    <path d="M 464 340 L 464 332 A 44 44 0 0 1 508 288 L 728 288 A 44 44 0 0 1 772 332"
          fill="none" stroke="url(#moduleRimBright)" stroke-width="5"/>
  </g>

  <!-- Module 3: Bottom-right widget block + crisp luminous sparkle accent -->
  <rect x="464" y="488" width="308" height="184" rx="44" fill="url(#botRightGrad)"/>
  <g clip-path="url(#botRightClip)">
    <rect x="464" y="488" width="308" height="184" fill="url(#blockCreaseAO)"/>
    <circle cx="618" cy="580" r="108" fill="url(#sparkleHalo)"/>
    <path d="M 464 540 L 464 532 A 44 44 0 0 1 508 488 L 728 488 A 44 44 0 0 1 772 532"
          fill="none" stroke="url(#moduleRimTeal)" stroke-width="5"/>
  </g>

  <!-- Crisp luminous 4-point accent sparkle inside bottom-right widget -->
  <path d="M 618 520 C 622 556, 642 576, 678 580 C 642 584, 622 604, 618 640 C 614 604, 594 584, 558 580 C 594 576, 614 556, 618 520 Z"
        fill="url(#sparkleGrad)"/>
</svg>
