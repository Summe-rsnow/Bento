<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Unified NSH Food-Family obsidian squircle clip -->
    <clipPath id="tileClip">
      <rect x="64" y="64" width="896" height="896" rx="212"/>
    </clipPath>

    <!-- Bento box & compartment clips for crisp AO and specular rim glints -->
    <clipPath id="outerBoxClip">
      <rect x="184" y="232" width="656" height="528" rx="112"/>
    </clipPath>
    <clipPath id="lipClip">
      <rect x="206" y="254" width="612" height="484" rx="94"/>
    </clipPath>
    <clipPath id="leftPocketClip">
      <rect x="242" y="290" width="222" height="412" rx="46"/>
    </clipPath>
    <clipPath id="topRightPocketClip">
      <rect x="484" y="290" width="298" height="196" rx="46"/>
    </clipPath>
    <clipPath id="botRightPocketClip">
      <rect x="484" y="506" width="298" height="196" rx="46"/>
    </clipPath>
    <clipPath id="umeboshiClip">
      <circle cx="353" cy="496" r="46"/>
    </clipPath>

    <!-- Deep obsidian-navy family tile -->
    <linearGradient id="tileBg" x1="128" y1="72" x2="896" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="52%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#090c14"/>
    </linearGradient>

    <radialGradient id="topAura" cx="512" cy="368" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0e1320" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tileRim" x1="180" y1="64" x2="844" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <radialGradient id="levitateGlow" cx="512" cy="834" r="240" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 750) scale(1 0.1)">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#ef4444" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Japanese dark urushi lacquer box shell + warm vermilion inner rim -->
    <linearGradient id="boxShellGrad" x1="184" y1="232" x2="840" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#433844"/>
      <stop offset="35%" stop-color="#282028"/>
      <stop offset="78%" stop-color="#181218"/>
      <stop offset="100%" stop-color="#100c11"/>
    </linearGradient>

    <linearGradient id="boxRimSpecular" x1="220" y1="232" x2="740" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lacquerLipGrad" x1="206" y1="254" x2="818" y2="738" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="38%" stop-color="#e11d48"/>
      <stop offset="78%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <linearGradient id="wellFloorGrad" x1="512" y1="274" x2="512" y2="718" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#221117"/>
      <stop offset="100%" stop-color="#12090d"/>
    </linearGradient>

    <!-- White fluffy steamed rice -->
    <linearGradient id="riceGrad" x1="260" y1="300" x2="450" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#fbf7ef"/>
      <stop offset="84%" stop-color="#ece4d5"/>
      <stop offset="100%" stop-color="#d6cbb9"/>
    </linearGradient>

    <radialGradient id="riceTopGlow" cx="322" cy="370" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glossy ruby-red Umeboshi -->
    <radialGradient id="umeboshiGrad" cx="338" cy="478" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="30%" stop-color="#f43f5e"/>
      <stop offset="74%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>

    <!-- Roasted Salmon Fillet (Yaki-shake) -->
    <linearGradient id="salmonGrad" x1="504" y1="312" x2="650" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="34%" stop-color="#fb923c"/>
      <stop offset="76%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <linearGradient id="salmonSkinGrad" x1="500" y1="304" x2="624" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#5c2810"/>
      <stop offset="100%" stop-color="#2d1206"/>
    </linearGradient>

    <!-- Golden Rolled Omelette (Tamagoyaki) -->
    <linearGradient id="tamagoTopGrad" x1="634" y1="306" x2="764" y2="418" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="78%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="tamagoFrontGrad" x1="628" y1="356" x2="764" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="38%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Fresh Lettuce Leaf -->
    <linearGradient id="lettuceGrad" x1="494" y1="516" x2="770" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="38%" stop-color="#22c55e"/>
      <stop offset="82%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Broccoli Floret Crowns & Stems -->
    <linearGradient id="broccoliCrownGrad" x1="510" y1="520" x2="626" y2="636" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="42%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <linearGradient id="broccoliStemGrad" x1="554" y1="600" x2="594" y2="676" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Cherry Tomatoes -->
    <radialGradient id="tomatoGradA" cx="654" cy="560" r="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="28%" stop-color="#f87171"/>
      <stop offset="68%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <radialGradient id="tomatoGradB" cx="716" cy="614" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="28%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <!-- Shared pocket ambient occlusion -->
    <linearGradient id="pocketAO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12060a" stop-opacity="0.16"/>
      <stop offset="22%" stop-color="#12060a" stop-opacity="0"/>
      <stop offset="74%" stop-color="#12060a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#12060a" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- Unified Family Squircle Container -->
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#tileBg)"/>
  <g clip-path="url(#tileClip)">
    <rect x="64" y="64" width="896" height="896" fill="url(#topAura)"/>
  </g>
  <rect x="65.25" y="65.25" width="893.5" height="893.5" rx="210.75"
        fill="none" stroke="url(#tileRim)" stroke-width="2.5"/>

  <!-- Soft levitation shadow + warm glow -->
  <ellipse cx="512" cy="788" rx="310" ry="38" fill="#04060b" fill-opacity="0.72"/>
  <ellipse cx="512" cy="816" rx="260" ry="28" fill="url(#levitateGlow)"/>

  <!-- 1. Dark Japanese Lacquer Bento Box Outer Shell -->
  <rect x="184" y="232" width="656" height="528" rx="112" fill="url(#boxShellGrad)"/>
  <g clip-path="url(#outerBoxClip)">
    <rect x="184" y="232" width="656" height="528" rx="112"
          fill="none" stroke="url(#boxRimSpecular)" stroke-width="8"/>
  </g>

  <!-- 2. Warm Vermilion Inner Lacquer Rim -->
  <rect x="206" y="254" width="612" height="484" rx="94" fill="url(#lacquerLipGrad)"/>
  <g clip-path="url(#lipClip)">
    <rect x="206" y="254" width="612" height="484" rx="94"
          fill="none" stroke="#ffe4e6" stroke-opacity="0.34" stroke-width="4"/>
  </g>

  <!-- 3. Recessed Compartment Tray Floor -->
  <rect x="224" y="272" width="576" height="448" rx="76" fill="url(#wellFloorGrad)"/>

  <!-- ======================================================================= -->
  <!-- COMPARTMENT 1 (LEFT): Steamed White Rice + Glossy Umeboshi + Sesame    -->
  <!-- ======================================================================= -->
  <g clip-path="url(#leftPocketClip)">
    <!-- Deep pocket shadow base -->
    <rect x="242" y="290" width="222" height="412" rx="46" fill="#2a151c"/>

    <!-- Sculpted fluffy mounded white rice -->
    <path d="M 238 342
             C 256 306, 294 294, 336 302
             C 374 288, 428 296, 466 334
             L 468 706
             C 424 714, 292 714, 238 704 Z"
          fill="url(#riceGrad)"/>
    <!-- Subtle layered rice grain mounds -->
    <path d="M 244 416 C 282 396, 334 402, 368 418 C 402 398, 442 406, 464 426"
          fill="none" stroke="#e4dccb" stroke-width="5" stroke-linecap="round" stroke-opacity="0.55"/>
    <path d="M 244 584 C 284 568, 330 574, 362 590 C 398 572, 438 578, 464 594"
          fill="none" stroke="#ded4c0" stroke-width="5" stroke-linecap="round" stroke-opacity="0.52"/>
    <ellipse cx="326" cy="366" rx="116" ry="72" fill="url(#riceTopGlow)"/>

    <!-- Umeboshi contact shadow on rice -->
    <ellipse cx="356" cy="508" rx="48" ry="44" fill="#9f1239" fill-opacity="0.22"/>

    <!-- Glossy ruby-red Umeboshi (pickled plum) -->
    <circle cx="353" cy="496" r="46" fill="url(#umeboshiGrad)"/>
    <g clip-path="url(#umeboshiClip)">
      <!-- Subtle natural plum creases -->
      <path d="M 326 484 C 344 494, 362 490, 378 478"
            fill="none" stroke="#881337" stroke-width="4" stroke-linecap="round" stroke-opacity="0.35"/>
      <path d="M 332 512 C 350 518, 370 514, 386 502"
            fill="none" stroke="#881337" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.28"/>
      <!-- Crisp top-left specular glint -->
      <ellipse cx="335" cy="476" rx="15" ry="9" transform="rotate(-28 335 476)"
               fill="#fff1f2" fill-opacity="0.72"/>
    </g>

    <!-- Roasted black sesame seeds sprinkled over rice -->
    <ellipse cx="304" cy="422" rx="4.5" ry="8" transform="rotate(-32 304 422)" fill="#1c1917"/>
    <ellipse cx="394" cy="410" rx="4.5" ry="8" transform="rotate(24 394 410)" fill="#292524"/>
    <ellipse cx="354" cy="378" rx="4.5" ry="8" transform="rotate(64 354 378)" fill="#1c1917"/>
    <ellipse cx="298" cy="576" rx="4.5" ry="8" transform="rotate(38 298 576)" fill="#292524"/>
    <ellipse cx="404" cy="582" rx="4.5" ry="8" transform="rotate(-40 404 582)" fill="#1c1917"/>
    <ellipse cx="356" cy="614" rx="4.5" ry="8" transform="rotate(14 356 614)" fill="#292524"/>

    <rect x="242" y="290" width="222" height="412" fill="url(#pocketAO)"/>
  </g>

  <!-- ======================================================================= -->
  <!-- COMPARTMENT 2 (TOP RIGHT): Glazed Roasted Salmon + Golden Tamagoyaki   -->
  <!-- ======================================================================= -->
  <g clip-path="url(#topRightPocketClip)">
    <rect x="484" y="290" width="298" height="196" rx="46" fill="#2a1618"/>

    <!-- Roasted Salmon Fillet (left half of top-right compartment) -->
    <ellipse cx="576" cy="404" rx="86" ry="70" fill="#0d0507" fill-opacity="0.48"/>
    <path d="M 498 334
             C 524 304, 594 302, 638 334
             C 662 352, 658 432, 632 466
             C 604 480, 526 476, 502 454
             C 488 438, 488 354, 498 334 Z"
          fill="url(#salmonGrad)"/>
    <!-- Charred seared salmon skin along top edge -->
    <path d="M 496 336
             C 526 300, 596 298, 640 336
             C 626 346, 610 342, 588 332
             C 554 318, 524 328, 496 348 Z"
          fill="url(#salmonSkinGrad)"/>
    <!-- Tender creamy salmon fat marbling lines -->
    <path d="M 514 374 C 548 358, 586 364, 622 384"
          fill="none" stroke="#fff7ed" stroke-width="6" stroke-linecap="round" stroke-opacity="0.54"/>
    <path d="M 508 408 C 546 392, 588 396, 626 418"
          fill="none" stroke="#fff7ed" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.46"/>
    <path d="M 516 440 C 548 426, 584 430, 614 448"
          fill="none" stroke="#ffedd5" stroke-width="5" stroke-linecap="round" stroke-opacity="0.40"/>

    <!-- Back Golden Tamagoyaki Pillow -->
    <rect x="640" y="302" width="128" height="94" rx="34" transform="rotate(-7 704 349)"
          fill="#0d0507" fill-opacity="0.40"/>
    <rect x="636" y="298" width="128" height="94" rx="34" transform="rotate(-7 700 345)"
          fill="url(#tamagoTopGrad)"/>
    <path d="M 656 334 C 676 318, 720 318, 742 332 C 748 344, 732 358, 704 358 C 680 358, 668 346, 678 338"
          fill="none" stroke="#92400e" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.34"/>

    <!-- Front Golden Tamagoyaki Pillow -->
    <rect x="628" y="370" width="136" height="100" rx="36" transform="rotate(4 696 420)"
          fill="#0d0507" fill-opacity="0.45"/>
    <rect x="624" y="366" width="136" height="100" rx="36" transform="rotate(4 692 416)"
          fill="url(#tamagoFrontGrad)"/>
    <!-- Rolled omelette swirl & glossy top highlight -->
    <path d="M 648 416 C 668 396, 718 396, 738 414 C 744 428, 724 442, 696 442 C 672 442, 662 428, 676 418 C 688 412, 704 416, 706 424"
          fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round" stroke-opacity="0.38"/>
    <path d="M 644 384 C 674 374, 712 374, 738 384"
          fill="none" stroke="#fefce8" stroke-width="5" stroke-linecap="round" stroke-opacity="0.62"/>

    <rect x="484" y="290" width="298" height="196" fill="url(#pocketAO)"/>
  </g>

  <!-- ======================================================================= -->
  <!-- COMPARTMENT 3 (BOTTOM RIGHT): Lettuce + Broccoli Florets + Tomatoes    -->
  <!-- ======================================================================= -->
  <g clip-path="url(#botRightPocketClip)">
    <rect x="484" y="506" width="298" height="196" rx="46" fill="#251316"/>

    <!-- Ruffled Emerald Lettuce Base -->
    <path d="M 492 598
             C 488 552, 524 516, 566 526
             C 596 508, 646 510, 674 532
             C 712 518, 760 538, 772 578
             C 784 622, 758 674, 714 688
             C 666 702, 598 698, 548 686
             C 508 676, 490 638, 492 598 Z"
          fill="url(#lettuceGrad)"/>
    <!-- Lettuce leaf ribs -->
    <path d="M 526 644 C 556 618, 594 594, 628 566"
          fill="none" stroke="#dcfce7" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.34"/>
    <path d="M 624 662 C 654 636, 692 608, 728 584"
          fill="none" stroke="#dcfce7" stroke-width="4" stroke-linecap="round" stroke-opacity="0.28"/>

    <!-- Sculpted Broccoli Floret -->
    <ellipse cx="576" cy="606" rx="64" ry="56" fill="#052e16" fill-opacity="0.42"/>
    <!-- Tender stem -->
    <path d="M 562 606 L 544 668 C 558 676, 582 676, 596 668 L 584 606 Z"
          fill="url(#broccoliStemGrad)"/>
    <!-- Clustered green crown -->
    <path d="M 516 588
             C 508 556, 534 532, 560 538
             C 574 516, 610 518, 624 542
             C 648 544, 662 574, 644 598
             C 634 614, 608 622, 578 620
             C 548 622, 520 612, 516 588 Z"
          fill="url(#broccoliCrownGrad)"/>
    <circle cx="556" cy="560" r="14" fill="#bbf7d0" fill-opacity="0.24"/>
    <circle cx="596" cy="552" r="16" fill="#bbf7d0" fill-opacity="0.20"/>
    <circle cx="620" cy="580" r="12" fill="#86efac" fill-opacity="0.18"/>

    <!-- Cherry Tomato A (back-upper) -->
    <circle cx="668" cy="580" r="48" fill="#0d0507" fill-opacity="0.40"/>
    <circle cx="666" cy="572" r="46" fill="url(#tomatoGradA)"/>
    <ellipse cx="649" cy="552" rx="14" ry="8" transform="rotate(-32 649 552)"
             fill="#ffffff" fill-opacity="0.72"/>
    <!-- Tomato A green calyx star -->
    <path d="M 672 536 L 664 546 L 652 544 L 664 552 L 662 562 L 672 554 L 682 560 L 678 548 L 690 544 L 678 542 Z"
          fill="#15803d"/>

    <!-- Cherry Tomato B (front-lower) -->
    <circle cx="728" cy="634" r="48" fill="#0d0507" fill-opacity="0.46"/>
    <circle cx="726" cy="626" r="45" fill="url(#tomatoGradB)"/>
    <ellipse cx="709" cy="606" rx="13" ry="8" transform="rotate(-30 709 606)"
             fill="#ffffff" fill-opacity="0.68"/>
    <!-- Tomato B green calyx star -->
    <path d="M 738 594 L 730 604 L 718 602 L 730 610 L 728 620 L 738 612 L 748 618 L 744 606 L 754 602 L 742 600 Z"
          fill="#16a34a"/>

    <rect x="484" y="506" width="298" height="196" fill="url(#pocketAO)"/>
  </g>
</svg>
